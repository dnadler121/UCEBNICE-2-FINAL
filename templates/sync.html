{% extends "base.html" %}{% block content %}<main class="main-card"><h1>🔄 Offline synchronizace</h1><p>Nejdříve stáhněte současnou UČEBNICI z Renderu do notebooku.</p>{% if msg %}<div class="notice"><p>{{msg}}</p></div>{% endif %}<form method="post"><label>Render URL</label><input name="render_url" value="{{cfg.render_url}}" style="width:100%;padding:12px"><label>SYNC_TOKEN</label><input type="password" name="token" placeholder="{% if cfg.token %}uložen – ponechte prázdné{% endif %}" style="width:100%;padding:12px"><div style="display:flex;gap:10px;margin-top:18px"><button class="switch" name="action" value="save">Uložit</button><button class="switch" name="action" value="pull">⬇️ První stažení z Renderu</button><a class="switch" href="{{url_for('teacher_home')}}">← Zpět</a></div></form></main>{% endblock %}
