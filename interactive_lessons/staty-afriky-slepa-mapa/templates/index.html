function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function renderBank(){bank.innerHTML='';shuffle(Object.keys(ITEMS).filter(k=>!placed.has(k))).forEach(k=>{let b=document.createElement('button');b.className='name'+(selected===k?' selected':'');b.textContent=ITEMS[k][lang];b.onclick=()=>{selected=k;renderBank();msg.textContent=lang==='cs'?'Název vybrán. Teď klikni na správné místo.':'Name selected. Now click the correct place.'};bank.appendChild(b)})}const DONE_COLORS=['#b9dfc5','#c8dcf1','#f4d9a8','#d9c9ed','#f2c7c7','#c7e4df','#e8d7b5','#d3e3b6'];function doneColor(k){let h=0;for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return DONE_COLORS[h%DONE_COLORS.length]}function paint(){placed.forEach(k=>document.querySelectorAll(`[data-code="${k}"]`).forEach(x=>{x.style.setProperty('--done-fill',doneColor(k));x.classList.add('correct')}))}
function bindRegions(){document.querySelectorAll('.region').forEach(el=>{el.onclick=()=>pair(el.dataset.code)});paint()}async function api(a,p={}){let u=`{{ api_url('ACTION') }}`.replace('ACTION',encodeURIComponent(a));let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});return r.json()}async function save(){if(mode==='test')await fetch('{{ state_url }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:{mode:'test',placed:[...placed]}})})}async function load(){try{let r=await fetch('{{ state_url }}'),j=await r.json();return j.ok&&j.state&&j.state.mode==='test'?j.state:null}catch(e){return null}}function upd(s){progress.textContent=`${s.completed||0} / ${TOTAL}`;score.hidden=mode!=='test';if(mode==='test')score.textContent=`${s.completed||0}/${TOTAL} • ${s.percent||0} %`}
async function start(m,force=false){mode=m;selected='';finish.classList.remove('show');document.getElementById('practice').classList.toggle('active',m==='practice');document.getElementById('test').classList.toggle('active',m==='test');let s;if(m==='test'&&!force){let old=await load();s=old?await api('restore',{mode:'test',placed:old.placed}):await api('start',{mode:m})}else s=await api('start',{mode:m});placed=new Set(s.placed||[]);document.querySelectorAll('.region').forEach(x=>x.classList.remove('correct','wrong'));paint();renderBank();upd(s);msg.textContent=lang==='cs'?'Vyber nejdřív název vpravo.':'Choose a name first.'}
async function pair(code){if(!selected||busy){if(!selected)msg.textContent=lang==='cs'?'Vyber nejdřív název vpravo.':'Choose a name first.';return}busy=true;let s=await api('check',{mode,outline_code:code,label_code:selected});upd(s);let els=document.querySelectorAll(`[data-code="${code}"]`);if(s.correct){placed.add(code);els.forEach(x=>{x.style.setProperty('--done-fill',doneColor(code));x.classList.add('correct')});selected='';renderBank();msg.textContent=lang==='cs'?'Správně!':'Correct!';await save()}else{els.forEach(x=>x.classList.add('wrong'));setTimeout(()=>els.forEach(x=>x.classList.remove('wrong')),550);msg.textContent=lang==='cs'?'Nesprávně. Zkus to znovu.':'Incorrect. Try again.'}if(s.done){finish.classList.add('show');finish.textContent=lang==='cs'?`Hotovo! ${s.completed}/${TOTAL}${mode==='test'?' = '+s.percent+' %':''}`:`Done! ${s.completed}/${TOTAL}`;if(mode==='test')await fetch('{{ complete_url }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({percent:s.percent,grade:s.grade})})}busy=false}
function setLang(l){lang=l;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.getElementById('back').textContent=l==='cs'?'Zpět do zeměpisu':'Back to geography';renderBank()}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));document.getElementById('practice').onclick=()=>start('practice');document.getElementById('test').onclick=()=>start('test');document.getElementById('restart').onclick=()=>start(mode,true);bindRegions();renderBank();start('practice');</script></body></html>
