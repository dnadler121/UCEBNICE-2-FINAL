<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ package.title }}</title><style>
:root{--green:#0b7a3d;--ink:#15231b;--muted:#617067;--line:#cfddd3;--bg:#f4f8f5;--blue:#1d6db6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.back{color:#285f3a;text-decoration:none;font-weight:750}button{font:inherit}.lang,.mode{display:flex;gap:8px;flex-wrap:wrap}.lang button,.mode button,.action{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.lang button.active,.mode button.active{background:var(--green);color:#fff;border-color:var(--green)}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.hero{padding:18px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:clamp(25px,3vw,40px)}.hero p{margin:5px 0;color:var(--muted)}.status{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 11px;border-radius:999px;background:#eef4f0;font-weight:800}.score{background:#fff4d9}.message{min-height:44px;margin-top:12px;padding:11px 13px;border-radius:12px;background:#edf4f0;font-weight:750}.board{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,.8fr);gap:14px}.card{padding:12px;min-width:0}.card h2{font-size:18px;margin:4px 4px 10px}.stage{background:linear-gradient(180deg,#f7faf8,#edf2ef);border-radius:18px;min-height:780px;border:1px solid #d7e0da;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px;position:relative}.bank{display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;max-height:720px;overflow:auto;padding:2px}.name{border:1px solid #bfcfc4;background:white;border-radius:10px;padding:9px 10px;font-weight:760;cursor:pointer}.name:hover{background:#edf7f0}.name.selected{outline:3px solid var(--blue);background:#eaf3ff}.hint{font-size:13px;color:var(--muted)}.finish{display:none;margin-top:14px;padding:15px;border-radius:14px;background:#e8f6ed;border:1px solid #9ec9aa;font-weight:800}.finish.show{display:block}.region{cursor:pointer;transition:.12s}.region:hover{stroke:#1d6db6!important;stroke-width:3!important;fill:rgba(29,109,182,.18)!important}.region.correct{fill:rgba(43,139,74,.35)!important;stroke:#23733c!important}.region.wrong{fill:rgba(220,55,55,.32)!important;stroke:#c93636!important;stroke-width:3!important}.body{width:min(610px,100%);height:auto;min-height:780px;filter:drop-shadow(0 8px 18px rgba(36,55,43,.08))}.body .region{cursor:pointer}@media(max-width:800px){.board{grid-template-columns:1fr}.bank{max-height:none}}

</div></div></section><section class="card"><h2 id="righttitle">Názvy orgánů</h2><p class="hint">Vyber název a potom klikni na správné místo.</p><div class="bank" id="bank"></div><p><button class="action" id="restart">Začít znovu</button></p></section></div></div><script>
const ITEMS={"BRAIN": {"cs": "Mozek", "en": "Brain"}, "THYROID": {"cs": "Štítná žláza", "en": "Thyroid gland"}, "TRACHEA": {"cs": "Průdušnice", "en": "Trachea"}, "LUNG_L": {"cs": "Levá plíce", "en": "Left lung"}, "LUNG_R": {"cs": "Pravá plíce", "en": "Right lung"}, "HEART": {"cs": "Srdce", "en": "Heart"}, "LIVER": {"cs": "Játra", "en": "Liver"}, "STOMACH": {"cs": "Žaludek", "en": "Stomach"}, "PANCREAS": {"cs": "Slinivka břišní", "en": "Pancreas"}, "SPLEEN": {"cs": "Slezina", "en": "Spleen"}, "KIDNEY_L": {"cs": "Levá ledvina", "en": "Left kidney"}, "KIDNEY_R": {"cs": "Pravá ledvina", "en": "Right kidney"}, "SMALL_INTESTINE": {"cs": "Tenké střevo", "en": "Small intestine"}, "LARGE_INTESTINE": {"cs": "Tlusté střevo", "en": "Large intestine"}, "BLADDER": {"cs": "Močový měchýř", "en": "Urinary bladder"}}; const REGIONS=[]; const TOTAL=15; let lang='cs',mode='practice',selected='',placed=new Set(),busy=false; const bank=document.getElementById('bank'),msg=document.getElementById('message'),progress=document.getElementById('progress'),score=document.getElementById('score'),finish=document.getElementById('finish');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function renderBank(){bank.innerHTML='';shuffle(Object.keys(ITEMS).filter(k=>!placed.has(k))).forEach(k=>{let b=document.createElement('button');b.className='name'+(selected===k?' selected':'');b.textContent=ITEMS[k][lang];b.onclick=()=>{selected=k;renderBank();msg.textContent=lang==='cs'?'Název vybrán. Teď klikni na správné místo.':'Name selected. Now click the correct place.'};bank.appendChild(b)})}function paint(){placed.forEach(k=>document.querySelectorAll(`[data-code="${k}"]`).forEach(x=>x.classList.add('correct')))}
function bindRegions(){document.querySelectorAll('.region').forEach(el=>{el.onclick=()=>pair(el.dataset.code)});paint()}async function api(a,p={}){let u=`{{ api_url('ACTION') }}`.replace('ACTION',encodeURIComponent(a));let r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});return r.json()}async function save(){if(mode==='test')await fetch('{{ state_url }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:{mode:'test',placed:[...placed]}})})}async function load(){try{let r=await fetch('{{ state_url }}'),j=await r.json();return j.ok&&j.state&&j.state.mode==='test'?j.state:null}catch(e){return null}}function upd(s){progress.textContent=`${s.completed||0} / ${TOTAL}`;score.hidden=mode!=='test';if(mode==='test')score.textContent=`${s.completed||0}/${TOTAL} • ${s.percent||0} %`}
async function start(m,force=false){mode=m;selected='';finish.classList.remove('show');document.getElementById('practice').classList.toggle('active',m==='practice');document.getElementById('test').classList.toggle('active',m==='test');let s;if(m==='test'&&!force){let old=await load();s=old?await api('restore',{mode:'test',placed:old.placed}):await api('start',{mode:m})}else s=await api('start',{mode:m});placed=new Set(s.placed||[]);document.querySelectorAll('.region').forEach(x=>x.classList.remove('correct','wrong'));paint();renderBank();upd(s);msg.textContent=lang==='cs'?'Vyber nejdřív název vpravo.':'Choose a name first.'}
async function pair(code){if(!selected||busy){if(!selected)msg.textContent=lang==='cs'?'Vyber nejdřív název vpravo.':'Choose a name first.';return}busy=true;let s=await api('check',{mode,outline_code:code,label_code:selected});upd(s);let els=document.querySelectorAll(`[data-code="${code}"]`);if(s.correct){placed.add(code);els.forEach(x=>x.classList.add('correct'));selected='';renderBank();msg.textContent=lang==='cs'?'Správně!':'Correct!';await save()}else{els.forEach(x=>x.classList.add('wrong'));setTimeout(()=>els.forEach(x=>x.classList.remove('wrong')),550);msg.textContent=lang==='cs'?'Nesprávně. Zkus to znovu.':'Incorrect. Try again.'}if(s.done){finish.classList.add('show');finish.textContent=lang==='cs'?`Hotovo! ${s.completed}/${TOTAL}${mode==='test'?' = '+s.percent+' %':''}`:`Done! ${s.completed}/${TOTAL}`;if(mode==='test')await fetch('{{ complete_url }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({percent:s.percent,grade:s.grade})})}busy=false}
function setLang(l){lang=l;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.getElementById('back').textContent=l==='cs'?'Zpět do biologie':'Back to biology';renderBank()}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));document.getElementById('practice').onclick=()=>start('practice');document.getElementById('test').onclick=()=>start('test');document.getElementById('restart').onclick=()=>start(mode,true);bindRegions();renderBank();start('practice');</script></body></html>
