let names=[], nameIndex=0;
function currentName(){return names.length?names[nameIndex%names.length]:''}
function named(msg){let n=currentName();return n?'<span class="nameTag">'+n+'</span>, '+msg:msg}
function advanceName(){if(names.length) nameIndex=(nameIndex+1)%names.length}
function setupNames(){let raw=document.getElementById('nameInput').value; names=raw.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean); if(!names.length) names=['Kamaráde']; localStorage.setItem('svet_names',JSON.stringify(names)); nameIndex=0; document.getElementById('nameOverlay').style.display='none'; render()}
document.getElementById('startBtn').onclick=setupNames;
document.getElementById('changeNames').onclick=()=>{document.getElementById('nameInput').value=names.join('\n');document.getElementById('nameOverlay').style.display='flex'};
try{let saved=JSON.parse(localStorage.getItem('svet_names')||'[]');if(saved.length)document.getElementById('nameInput').value=saved.join('\n')}catch(e){}
let bi=0,ti=0,seen=new Set(); const menu=document.getElementById('menu'),card=document.getElementById('card');
const all=blocks.reduce((a,b)=>a+b.tasks.length,0); total.textContent=all;
function key(){return bi+'-'+ti} function renderMenu(){menu.innerHTML='';blocks.forEach((b,i)=>{let x=document.createElement('button');x.className='block'+(i===bi?' on':'');x.textContent=b.icon+' '+b.title+' ('+b.tasks.length+')';x.onclick=()=>{bi=i;ti=0;render()};menu.appendChild(x)})}
function progress(){seen.add(key());bar.style.width=(seen.size/all*100)+'%'}
function render(){renderMenu();let b=blocks[bi],t=b.tasks[ti];blockName.textContent=b.icon+' '+b.title;counter.textContent=(ti+1)+' / '+b.tasks.length;document.getElementById('who').innerHTML='🎯 Teď odpovídá: <span class="nameTag">'+currentName()+'</span>';card.innerHTML='';progress();let type=t[0];if(type==='quiz'){card.innerHTML=`<div class="prompt">${named(t[1])}</div><div class="visual">${t[2]}</div><div class="answers"><button class="ans">${t[3]}</button><button class="ans">${t[4]}</button></div><div class="feedback"></div>`;let btn=[...card.querySelectorAll('.ans')]; if(Math.random()>.5) card.querySelector('.answers').append(btn[0]); card.querySelectorAll('.ans').forEach(x=>x.onclick=()=>{card.querySelectorAll('.ans').forEach(y=>y.disabled=true);let ok=x.textContent===t[3];x.classList.add(ok?'ok':'bad');card.querySelector('.feedback').textContent=ok?'👏 '+currentName()+', VÝBORNĚ!':'🙂 '+currentName()+', ZKUSÍME TO SPOLEČNĚ JEŠTĚ JEDNOU.';if(!ok){setTimeout(()=>{card.querySelectorAll('.ans').forEach(y=>{y.disabled=false;y.classList.remove('bad')});card.querySelector('.feedback').textContent=''},1200)}})}else if(type==='yn'){card.innerHTML=`<div class="prompt">${named(t[1])}</div><div class="visual">👍 👎</div><div class="answers"><button class="ans">ANO</button><button class="ans">NE</button></div><div class="feedback"></div>`;card.querySelectorAll('.ans').forEach(x=>x.onclick=()=>{card.querySelectorAll('.ans').forEach(y=>y.disabled=true);let ok=x.textContent===t[2];x.classList.add(ok?'ok':'bad');card.querySelector('.feedback').textContent=ok?'👏 '+currentName()+', SPRÁVNĚ!':'🙂 '+currentName()+', ZKUSÍME TO JEŠTĚ JEDNOU.';if(!ok)setTimeout(()=>{card.querySelectorAll('.ans').forEach(y=>{y.disabled=false;y.classList.remove('bad')});card.querySelector('.feedback').textContent=''},1200)})}else if(type==='choice'){card.innerHTML=`<div class="prompt">${named(t[1])}</div><div class="answers"><button class="ans">${t[2]}</button><button class="ans">${t[3]}</button></div><div class="hint">Tady není špatná odpověď. Každý může ukázat svou volbu.</div>`;card.querySelectorAll('.ans').forEach(x=>x.onclick=()=>{x.classList.add('ok');card.insertAdjacentHTML('beforeend','<div class="feedback">👍 '+currentName()+', DOBRÁ VOLBA!</div>')})}else if(type==='song'){card.innerHTML=`<div class="celebrate">🎵 ${t[1]} – ${t[2]}</div><div class="songbox" tabindex="0">
<p>Když máš srdce zjihlé,<br>když máš potíže,<br>tak dej cihlu k cihle,<br>těsto do díže,<br>upeč třeba chleba,<br>postav třeba zeď,<br>žal se krásně vstřebá,<br>začni s tím hned teď,<br>začni s tím hned teď.</p>
<p>Dělání, dělání,<br>všechny smutky zahání,<br>dělání, dělání je lék.</p>
<p>Dělání, dělání,<br>to nám úsměv zachrání,<br>dělání, dělání je lék.</p>
</div><div class="songnote">🎵 Dělání – text, který jsi dodal pro společné zpívání. Roluj kolečkem myši nebo táhni posuvník.</div>`}else{card.innerHTML=`<div class="bigdo">${b.icon}</div><div class="celebrate">${t[1]}</div><div class="instruction">${named(t[2])}</div><div class="hint">Dejte si na úkol čas. Zapojit se může každý podle svých možností.</div>`}}
function go(d){ti+=d;if(ti>=blocks[bi].tasks.length){if(bi<blocks.length-1){bi++;ti=0}else ti=blocks[bi].tasks.length-1}if(ti<0){if(bi>0){bi--;ti=blocks[bi].tasks.length-1}else ti=0}render()} next.onclick=()=>{advanceName();go(1)};prev.onclick=()=>go(-1);random.onclick=()=>{advanceName();bi=Math.floor(Math.random()*blocks.length);ti=Math.floor(Math.random()*blocks[bi].tasks.length);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});render();
</script></body></html>
