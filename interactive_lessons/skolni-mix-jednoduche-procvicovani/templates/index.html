let names=[], nameIndex=0;

function go(d){ti+=d;if(ti>=blocks[bi].tasks.length){if(bi<blocks.length-1){bi++;ti=0}else ti=blocks[bi].tasks.length-1}if(ti<0){if(bi>0){bi--;ti=blocks[bi].tasks.length-1}else ti=0}render()} next.onclick=()=>{advanceName();go(1)};prev.onclick=()=>go(-1);random.onclick=()=>{advanceName();bi=Math.floor(Math.random()*blocks.length);ti=Math.floor(Math.random()*blocks[bi].tasks.length);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});render();
